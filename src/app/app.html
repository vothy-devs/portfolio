<div
  class="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans selection:bg-sky-500 selection:text-white antialiased">

  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/60">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">

      <a routerLink="/" class="group flex items-center gap-3">
        <div
          class="h-9 w-9 rounded-xl bg-gradient-to-br from-sky-400 to-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-sky-500/10 group-hover:scale-105 transition-transform">
          VP
        </div>
        <div class="flex flex-col">
          <span
            class="text-sm font-extrabold tracking-tight text-slate-900 group-hover:text-sky-600 transition-colors">Vothy
            Prak</span>
          <span class="text-[10px] font-semibold text-slate-400 tracking-wide">Technical Project Manager</span>
        </div>
      </a>

      <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/40">
        <a routerLink="/" routerLinkActive="bg-white text-sky-600 shadow-sm" [routerLinkActiveOptions]="{exact: true}"
          class="text-xs font-bold px-4 py-2 rounded-lg text-slate-500 hover:text-slate-900 transition-all duration-200">
          Home
        </a>
        <a routerLink="/portfolio" routerLinkActive="bg-white text-sky-600 shadow-sm"
          class="text-xs font-bold px-4 py-2 rounded-lg text-slate-500 hover:text-slate-900 transition-all duration-200">
          Portfolio
        </a>
        <a routerLink="/contact" routerLinkActive="bg-white text-sky-600 shadow-sm"
          class="text-xs font-bold px-4 py-2 rounded-lg text-slate-500 hover:text-slate-900 transition-all duration-200">
          Contact
        </a>
      </div>

    </div>
  </nav>

  <main class="flex-grow max-w-5xl w-full mx-auto px-6 py-12 md:py-16">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200/60 bg-white py-6">
    <div
      class="max-w-5xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs font-medium text-slate-400">
      <p>&copy; 2026 Vothy Prak. All rights reserved.</p>
      <p class="flex items-center gap-1.5">
        <span class="h-2 w-2 rounded-full bg-sky-400"></span>
        Built by Prak Creative Media
      </p>
    </div>
  </footer>

</div>
